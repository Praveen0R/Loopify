{% extends 'base.html' %}{% block content %}
<div class="form-card small">
  <h1>Edit profile</h1>
  <form method="post" class="form">
    <label
      >Name
      <input name="name" value="{{user['name']}}" required />
    </label>
    <label
      >Phone
      <input name="phone" value="{{user['phone']}}" required />
    </label>
    <label
      >Department
      <input
        name="department"
        value="{{user['department'] or ''}}"
        placeholder="CSE"
      />
    </label>
    <label
      >Semester
      <input
        type="number"
        name="semester"
        min="1"
        max="8"
        value="{{user['semester'] or ''}}"
      />
    </label>
    <button class="primary">Save changes</button>
  </form>
</div>
{% endblock %}
